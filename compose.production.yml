services:
frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
        NEXT_PUBLIC_API_URL: ""
  container_name: my-project-frontend
  ports:
    - "3000:3000"
  depends_on:
    - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my-project-backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database

  database:
    image: mysql:8.4
    container_name: my-project-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: myapp
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: my-project-phpmyadmin
    restart: unless-stopped
    depends_on:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql_data: