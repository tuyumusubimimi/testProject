services:
frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
        NEXT_PUBLIC_API_URL: ""
  container_name: my-project-frontend
  ports:
    - "3000:3000"
  depends_on:
    - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my-project-backend
    ports:
      - "8000:80"
    depends_on:
      - database

  database:
    image: mysql:8.4
    container_name: my-project-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: myapp
      MYSQL_PASSWORD: mypassword"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: